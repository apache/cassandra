# IBM SonarQube Configuration for Cassandra (CC)

# ==============================================================================
# Project Identification
# ==============================================================================
sonar.projectKey=544478-247111689
sonar.projectName=datastax/cassandra

# ==============================================================================
# SonarQube Server
# ==============================================================================
# Host - IBM SonarQube (Cloudflare endpoint for API, no truststore needed)
sonar.host.url=https://sonarqube-prod.whitewater.ibm.com

# ==============================================================================
# Source Code Paths
# ==============================================================================
sonar.sources=src/java,src/gen-java,src/antlr,src/resources
sonar.tests=test/unit,test/long,test/burn,test/distributed,test/memory,test/microbench

# ==============================================================================
# Binary Paths (Compiled Classes)
# ==============================================================================
sonar.java.binaries=build/classes/main
sonar.java.test.binaries=build/test/classes

# ==============================================================================
# Library Dependencies
# ==============================================================================
sonar.java.libraries=lib/**/*.jar,build/lib/**/*.jar

# ==============================================================================
# Coverage Report Path
# ==============================================================================
# To generate coverage:
#   1. ant test (or specific test target)
#   2. ant jacoco-merge   (creates build/jacoco/jacoco.exec)
#   3. ant jacoco-report  (creates build/jacoco/report.xml)
sonar.coverage.jacoco.xmlReportPaths=build/jacoco/report.xml

# ==============================================================================
# Quality Gate
# ==============================================================================
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=1800

# ==============================================================================
# HTTP Timeout for Report Upload
# ==============================================================================
# Default is 60s, setting to 120s (2x) to allow for transient performance issues
sonar.ws.timeout=120

# ==============================================================================
# Encoding
# ==============================================================================
sonar.sourceEncoding=UTF-8

# ==============================================================================
# Exclusions (Optional - adjust as needed)
# ==============================================================================
# Exclude generated code, test utilities, etc.
# sonar.exclusions=**/gen-java/**,**/generated/**
# sonar.test.exclusions=**/test/data/**

# ==============================================================================
# Branch/PR Configuration
# ==============================================================================
# These are set dynamically by the workflow via command-line arguments:
# For Pull Requests:
#   -Dsonar.pullrequest.key=<PR number>
#   -Dsonar.pullrequest.branch=<PR branch name>
#   -Dsonar.pullrequest.base=<base branch>
#
# For Branch scans:
#   -Dsonar.branch.name=<branch name>
