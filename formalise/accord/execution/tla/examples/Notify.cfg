SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  CmdEntries = {"c1"}
  KeyEntries = {"k1","k2"}
  NumTasks = 3
  TaskTxns <- MCTaskTxns
  TaskKeys <- MCTaskKeys
  TaskRegion <- MCTaskRegion
  TaskSync <- MCTaskSync
  MinBatch = 1
  MaxDepth = 4
  PDrainNotifies = TRUE
  PRevokeNotifies = TRUE
  PModelLoading = FALSE
INVARIANT TypeOK
INVARIANT G4_Bounded
INVARIANT G1_SyncSound
INVARIANT G1_PositionsHeld
INVARIANT G3_Disjoint
INVARIANT G2_NoLostWakeup
\* the batch sets hold only keys we still lead: the model-side statement of RELEASE_QUEUE's
\* REQUIRE_RUNNABLE now that NonSyncState.prepareExclusive locks the whole batch without
\* re-checking it.  G1_Strong follows from it; both are listed so a failure names one of them
INVARIANT G1_BatchLed
INVARIANT G1_Strong
\* the cascade drains, and nothing is stranded.  Temporal, so PROPERTY not INVARIANT;
\* G4_Bounded catches a cascade that exceeds MaxDepth, these catch one that never ends
PROPERTY G4_Drains
PROPERTY Termination
\* L3: a notification handler takes no position - an ACTION property, so INVARIANT cannot
\* express it.  True by construction here (no handler mutates holds or region); it fails if
\* one ever does, which is when Probe_Nested starts being reached too
PROPERTY L3_HandlerTakesNoPosition
\* The coverage probes are NOT here: each is a negated reachability claim, so TLC would
\* halt at the first one it reports violated.  Run them with ../notify.py, which drives
\* them one at a time and asserts which are expected reached and which unreachable.
