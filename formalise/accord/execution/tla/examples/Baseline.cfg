SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  CmdEntries = {"c1"}
  KeyEntries = {"k1", "k2"}
  NumTasks = 2
  TaskTxns <- MCTaskTxns
  TaskKeys <- MCTaskKeys
  TaskParent <- MCTaskParent
  MinBatch = 1
  BlockedLimit = 0
  PAlwaysReady = "ON_NON_SUBSET"
  PModelLoading = FALSE
  PAllowAdoption = FALSE
  PPartialRounds = TRUE
  PUpgradeOnStart = TRUE
  PSubmitBeforeRelease = TRUE
  PAllowUnseqIncrWithTxn = FALSE
  PAllowFifoAdoption = FALSE
  PAllowDoubleLock = FALSE
  PBagInterleaves = FALSE
INVARIANT TypeOK
INVARIANT Inv_LockerIsFifo
INVARIANT Inv_LockLeads
INVARIANT Inv_OneProspectiveLocker
INVARIANT Inv_AtMostOneLock
INVARIANT Inv_Isolation
INVARIANT RankOK
INVARIANT NoCycle
INVARIANT NoStuck
\* the fairness conjunct in Spec exists for this; matrix.py checks it under --liveness
PROPERTY Termination
